name: API Validation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check OpenAPI contract drift
        run: python scripts/openapi_contract.py
      - name: Run Pytest suite
        run: |
          mkdir -p reports
          pytest -v --junitxml=reports/pytest-junit.xml --html=reports/pytest-report.html --self-contained-html --cov=app --cov-report=term-missing
      - name: Upload Python reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: reports/

  newman-tests:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Audit Node dependencies
        run: npm audit --audit-level=moderate
      - name: Start API
        run: |
          mkdir -p reports
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy within 60 seconds"
          cat api.log
          exit 1
      - name: Run performance smoke check
        run: python scripts/performance_smoke.py
      - name: Run Newman collection
        run: npm run postman:test
      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
